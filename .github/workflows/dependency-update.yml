name: Dependency Update

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger

# Deliberately no `pull-requests: write`. This workflow pushes a branch and
# reports it; it does not open the pull request. Opening one requires the
# repository setting "Allow GitHub Actions to create and approve pull
# requests", and that single switch also grants the ability to *approve*, which
# would let automation satisfy required review on its own. Pushing a branch and
# leaving a human to open the PR keeps that door shut.
permissions:
  contents: write

jobs:
  update-dependencies:
    name: Update Go Dependencies
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.12'

    - name: Update dependencies
      id: update
      run: |
        # Get current go.sum hash
        CURRENT_HASH=$(sha256sum go.sum | cut -d' ' -f1)
        echo "current_hash=$CURRENT_HASH" >> $GITHUB_OUTPUT

        # Update all dependencies
        go get -u ./...
        go mod tidy

        # Get new go.sum hash
        NEW_HASH=$(sha256sum go.sum | cut -d' ' -f1)
        echo "new_hash=$NEW_HASH" >> $GITHUB_OUTPUT

        # Check if anything changed
        if [ "$CURRENT_HASH" != "$NEW_HASH" ]; then
          echo "changes_detected=true" >> $GITHUB_OUTPUT
        else
          echo "changes_detected=false" >> $GITHUB_OUTPUT
        fi

    - name: Run tests
      if: steps.update.outputs.changes_detected == 'true'
      run: |
        go test -v $(go list ./... | grep -v '/debug')

    - name: Build check
      if: steps.update.outputs.changes_detected == 'true'
      run: |
        go build -v .

    - name: Push update branch
      id: push
      if: steps.update.outputs.changes_detected == 'true'
      env:
        BRANCH: automated/dependency-update
      run: |
        set -euo pipefail

        git config user.name  'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'

        git checkout -B "$BRANCH"
        git add go.mod go.sum
        git commit -m 'chore: update Go dependencies'

        # Force-with-lease: the branch is a disposable snapshot of "latest
        # dependencies as of this run", so each run replaces the previous one.
        # --force-with-lease still refuses if someone else has pushed to it.
        git push --force-with-lease origin "$BRANCH"

        echo "branch=$BRANCH" >> $GITHUB_OUTPUT

    - name: Report what to do next
      if: steps.update.outputs.changes_detected == 'true'
      env:
        BRANCH: ${{ steps.push.outputs.branch }}
        REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      run: |
        {
          echo "## Dependency update ready"
          echo
          echo "Tests and build passed against the updated modules, and the"
          echo "changes are pushed to \`$BRANCH\`."
          echo
          echo "This workflow does not open the pull request itself - see the"
          echo "\`permissions\` comment at the top of the workflow for why."
          echo "Open it here:"
          echo
          echo "$REPO_URL/compare/${{ github.event.repository.default_branch }}...$BRANCH?expand=1"
          echo
          echo "### Changed"
          echo '```'
          git --no-pager diff --stat "origin/${{ github.event.repository.default_branch }}" -- go.mod go.sum
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Report that nothing changed
      if: steps.update.outputs.changes_detected == 'false'
      run: |
        echo "## Dependencies already up to date" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "\`go get -u ./...\` produced no change to go.sum." >> "$GITHUB_STEP_SUMMARY"
